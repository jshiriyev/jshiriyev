<svg xmlns="http://www.w3.org/2000/svg" width="350" height="212" viewBox="0 0 350 212" role="img" aria-label="GitHub Stats">

  <style>
    .bg { fill: #ffffff; stroke: #d0d7de; }
    .title { font: 600 16px 'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif; fill: #1f6feb; }
    .label { font: 400 13px 'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif; fill: #424a53; }
    .value { font: 600 13px 'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif; fill: #1f2328; }
    .track { fill: #eaeef2; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; stroke: #30363d; }
      .title { fill: #58a6ff; }
      .label { fill: #9198a1; }
      .value { fill: #e6edf3; }
      .track { fill: #21262d; }
    }
  </style>
  <rect class="bg" x="0.5" y="0.5" rx="6" width="349" height="211"/>
  <text class="title" x="20" y="32">GitHub Stats</text>
  <text class="label" x="20" y="62">Public repositories</text>
  <text class="value" x="330" y="62" text-anchor="end">7</text>
  <text class="label" x="20" y="87">Stars earned</text>
  <text class="value" x="330" y="87" text-anchor="end">13</text>
  <text class="label" x="20" y="112">Commits (last year)</text>
  <text class="value" x="330" y="112" text-anchor="end">139</text>
  <text class="label" x="20" y="137">Pull requests (last year)</text>
  <text class="value" x="330" y="137" text-anchor="end">3</text>
  <text class="label" x="20" y="162">Issues (last year)</text>
  <text class="value" x="330" y="162" text-anchor="end">0</text>
  <text class="label" x="20" y="187">Contributed to (last year)</text>
  <text class="value" x="330" y="187" text-anchor="end">1</text>
</svg>
